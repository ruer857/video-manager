<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频素材管理器</title>
  <meta name="application-name" content="视频素材管理器">
  <link rel="icon" type="image/x-icon" href="/video-manager.ico">
  <link rel="shortcut icon" href="/video-manager.ico">
  <script>
    (() => {
      const mode = localStorage.getItem("video-manager-theme") || "light";
      const dark = mode === "dark" ||
        (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.themeMode = mode;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      window.videoManagerWindow?.setTitleBarTheme(dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="/desktop.css">
  <link rel="stylesheet" href="/preview-enhancements.css">
  <link rel="stylesheet" href="/local-management.css">
</head>
<body>
  <div class="app-titlebar" aria-hidden="true">
    <img src="/video-manager.ico" alt="">
    <span>视频素材管理器</span>
  </div>
  <aside class="sidebar">
    <div class="brand"><b>影</b><div><strong>视频素材管理器</strong><span>本机素材工作台</span></div></div>
    <nav class="sidebar-nav" aria-label="主导航">
      <button class="nav active" data-view="library"><span class="nav-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16M8 9h13M8 15h13"/></svg>内容总览</span><i id="nav-count">0</i></button>
      <button class="nav" data-category="facelift"><span class="nav-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>拉皮视频</span><i id="facelift-count">0</i></button>
      <button class="nav" data-category="ageless"><span class="nav-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m5 17 4-4 3 3 2-2 5 3"/></svg>老而不衰视频</span><i id="ageless-count">0</i></button>
      <button class="nav" data-view="inbox"><span class="nav-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM8 3v6M16 3v6M8 14h8"/></svg>待归组素材</span><i id="inbox-count">0</i></button>
      <button class="nav" data-view="platform"><span class="nav-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.5 18-3.4-7.1L3 10.5zM10.1 13.9 21 3"/></svg>平台预览</span><i id="platform-count">8</i></button>
      <button class="nav" data-view="inventory"><span class="nav-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4zM3 4h18v4H3zM9 12h6"/></svg>发布库存</span><i id="inventory-count">0</i></button>
      <button class="nav" data-view="publish-tasks"><span class="nav-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg>发布任务</span><i id="publish-task-count">0</i></button>
      <button class="nav" data-view="settings"><span class="nav-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>目录与设置</span><i>⌘</i></button>
    </nav>
    <div class="theme-switcher" role="group" aria-label="外观模式">
      <button type="button" data-theme-choice="system" title="跟随电脑外观">自动</button>
      <button type="button" data-theme-choice="light" title="使用浅色外观">浅色</button>
      <button type="button" data-theme-choice="dark" title="使用深色外观">深色</button>
    </div>
    <div class="local"><span></span>本机数据库已连接</div>
  </aside>
  <main>
    <header>
      <div><small>LOCAL CONTENT LIBRARY</small><h1 id="page-title">内容总览</h1></div>
      <div class="header-actions"><button type="button" class="ghost" id="create-publish-task">创建发布任务</button><button class="ghost" id="scan-button">扫描新增视频</button><button class="ghost" id="scan-all-button">扫描所有视频</button><button class="primary" id="new-button">＋ 新建视频</button></div>
    </header>
    <section id="stats" class="stats"></section>
    <section id="library-view">
      <section class="panel library-panel">
        <div class="library-toolbar">
          <div class="filters"><label class="search-field"><span aria-hidden="true"></span><input id="search" placeholder="搜索标题、编号或备注"></label><select id="sort-filter" aria-label="排序方式"><option value="material-desc">素材时间：最新优先</option><option value="material-asc">素材时间：最早优先</option><option value="updated-desc">最近修改优先</option><option value="code-desc">编号：从大到小</option><option value="code-asc">编号：从小到大</option><option value="title-asc">标题名称排序</option></select><select id="asset-filter"><option value="all">全部素材状态</option><option value="complete">素材完整</option><option value="missing">素材缺失</option></select><select id="publish-filter"><option value="all">全部发布状态</option><option value="complete">全平台完成</option><option value="open">尚未完成</option></select></div>
          <div class="panel-head video-list-head"><h2>视频清单</h2><div class="video-visibility-tabs"><button class="active" data-video-visibility="visible">展示视频</button><button data-video-visibility="all">所有视频</button><button data-video-visibility="pending">待剪辑 <i id="pending-video-count">0</i></button><button data-video-visibility="hidden">隐藏视频 <i id="hidden-video-count">0</i></button></div><span id="result-count">0 条</span></div>
        </div>
        <div class="video-columns" aria-hidden="true"><span>视频</span><span>素材</span><span>发布</span><span></span></div>
        <div id="video-list"></div>
      </section>
    </section>
    <section id="inbox-view" class="hidden"><div class="panel"><div class="panel-head"><div><h2>自动归组建议</h2><p>确认前不会写入正式记录，也不会移动任何文件。</p></div><button class="ghost" id="scan-again">重新扫描</button></div><div id="candidate-list"></div></div></section>
    <section id="platform-view" class="hidden"><div id="platform-preview"></div></section>
    <section id="inventory-view" class="hidden"><div id="inventory-page"></div></section>
    <section id="publish-task-view" class="hidden"><div id="publish-task-list"></div></section>
    <section id="settings-view" class="hidden"><div class="settings-shell"><nav class="settings-tabs" aria-label="目录与设置分类"><button type="button" class="active" data-settings-tab="sources">素材目录</button><button type="button" data-settings-tab="platforms">发布账号</button><button type="button" data-settings-tab="safety">数据安全</button></nav><div class="settings-grid"><section class="panel pad settings-panel active" data-settings-panel="sources"><h2>素材目录</h2><p>可配置多个目录。扫描只读取文件信息。</p><div id="source-list"></div><button class="ghost full" id="add-source">＋ 选择目录</button></section><section class="panel pad settings-panel" data-settings-panel="platforms"><h2>发布账号</h2><p>这里填写方便自己分辨的内部代称；真实账号名字和ID可在“平台预览”中填写。</p><div id="platform-list"></div><button class="ghost full" id="add-platform">＋ 添加账号</button></section><section class="panel pad settings-panel" data-settings-panel="safety"><h2>数据安全</h2><p>导出完整记录，恢复时不影响原视频文件。</p><div class="button-row"><button class="ghost" id="export-button">导出备份</button><label class="ghost file-label">恢复备份<input id="import-input" type="file" accept=".json"></label></div><div class="reset-materials-row"><div><strong>重置所有素材</strong><span>清空视频管理记录和待归组结果，不删除磁盘中的原文件。</span></div><button class="danger-outline" id="reset-materials">重置所有素材</button></div></section></div></div></section>
  </main>
  <div id="close-window-modal" class="app-close-dialog-layer hidden" aria-hidden="true">
    <section class="app-close-dialog" role="dialog" aria-modal="true" aria-labelledby="close-window-title" aria-describedby="close-window-description">
      <button type="button" id="close-window-dismiss" class="app-close-dialog-dismiss" aria-label="取消关闭">×</button>
      <div class="app-close-dialog-icon" aria-hidden="true">影</div>
      <div class="app-close-dialog-copy">
        <span class="app-close-dialog-kicker">窗口选项</span>
        <h2 id="close-window-title">关闭视频素材管理器？</h2>
        <p id="close-window-description">你可以将程序收纳到系统托盘继续在后台运行，也可以完全关闭程序。</p>
      </div>
      <div class="app-close-dialog-actions">
        <button type="button" id="close-window-cancel" class="ghost">取消</button>
        <button type="button" id="close-window-quit" class="app-close-dialog-quit">关闭程序</button>
        <button type="button" id="close-window-tray" class="primary">最小化到托盘</button>
      </div>
    </section>
  </div>
  <div id="drawer-layer"></div>
  <div id="modal-layer"></div>
  <button id="toast" class="toast hidden"></button>
  <script src="/desktop.js"></script>
  <script src="/preview-enhancements.js"></script>
  <script src="/local-management.js"></script>
</body>
</html>
